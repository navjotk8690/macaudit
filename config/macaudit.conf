# MacAudit 3.4.23 configuration. Values are parsed as data, never executed as shell code.
RETENTION_DAYS=90
ENABLE_NOTIFICATIONS=1
NOTIFY_MIN_SEVERITY=HIGH
NOTIFICATION_COOLDOWN_SECONDS=900
ENABLE_UNIFIED_LOG_SCAN=1
ENABLE_TCC_SCAN=1
ENABLE_JUMPCLOUD_SCAN=1
DASHBOARD_ENABLED=1
DASHBOARD_PORT=8765
FAST_INTERVAL_SECONDS=60
STANDARD_INTERVAL_SECONDS=300
SLOW_INTERVAL_SECONDS=1800
DATA_MOVEMENT_INTERVAL_SECONDS=300

# Local-only data movement monitoring. Filenames are stored in root-owned local logs/state.
ENABLE_DATA_MOVEMENT_SCAN=1
DATA_MOVEMENT_RECORD_FILENAMES=1
DATA_MOVEMENT_MIN_FILE_MB=1
DATA_MOVEMENT_TRACK_MIN_BYTES=0
DATA_MOVEMENT_MAX_DROP_PERCENT=35
DATA_MOVEMENT_LOOKBACK_MINUTES=10
DATA_MOVEMENT_WATCH_HOME=1

# Monitor only the currently logged-in user's home by default. Set to 1 to
# inventory all normal local user homes.
DATA_MOVEMENT_WATCH_ALL_USERS=0
# Periodic reconciliation will never accept more than this many unresolved
# disappearances in one scan. Live filesystem events remain independent.
DATA_MOVEMENT_MAX_RECONCILE_CHANGES=200
DATA_MOVEMENT_WATCH_FOLDERS=Desktop,Documents,Downloads
DATA_MOVEMENT_EXCLUDE_DIRS=Library,.Trash,node_modules,.git,.venv,venv,__pycache__,.pyenv,.cache,.npm,.local,.cargo,.rustup,.gradle,DerivedData,build,dist,.TemporaryItems,.Spotlight-V100,.fseventsd
PERSISTENCE_METADATA_COOLDOWN_SECONDS=21600
PERSISTENCE_CHANGE_COOLDOWN_SECONDS=21600

# Near-real-time local filesystem event watcher (built-in macOS fs_usage).
ENABLE_DATA_MOVEMENT_WATCHER=1
# Repeated incomplete-inventory warnings are rate-limited to avoid timeline noise.
DATA_MOVEMENT_INVENTORY_WARNING_COOLDOWN_SECONDS=21600

# Tag every event with local user-presence state. Events after this many idle
# seconds are marked AWAY; locked/logged-out states are detected separately.
PRESENCE_AWAY_SECONDS=600

# Detect software-like downloads (.dmg, .pkg/.mpkg, .app, and archives in Downloads).
ENABLE_SOFTWARE_DOWNLOAD_SCAN=1
